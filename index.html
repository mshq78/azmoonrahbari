    <title>وقت تصمیم، شبیه کدومی؟ — رهبری هوشیار</title>
    <meta name="description" content="بازی ۱۲ موقعیتی سبک تصمیم‌گیری مدیران و مقایسه با ۵ شخصیت تاریخی — رهبری هوشیار" />

    <!-- Prevent flash of unstyled theme on initial load -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme-preference');
          var theme = 'light';
          if (saved === 'dark' || saved === 'light') {
            theme = saved;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
          } else {
            root.classList.remove('dark');
            root.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
