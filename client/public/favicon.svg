<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2340"/>
      <stop offset="100%" stop-color="#16304F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C14E"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="28" y="28" width="456" height="456" rx="92" fill="none" stroke="url(#gold)" stroke-width="12" stroke-opacity="0.85"/>
  <rect x="44" y="44" width="424" height="424" rx="80" fill="none" stroke="url(#gold)" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Persian letter 'و' (Vav for 'وقت تصمیم') in bold elegant form -->
  <text x="50%" y="54%" font-family="Vazirmatn, Arial, sans-serif" font-size="250" font-weight="900" fill="url(#gold)" text-anchor="middle" dominant-baseline="central">و</text>
